<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Hau Para Fuma">
  <title>Hau Para Fuma</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12a184"/>
      <stop offset=".55" stop-color="#0e7c66"/>
      <stop offset="1" stop-color="#06251f"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Sprout: "moris di'ak" — the new growth after quitting. Deliberately not
       a cigarette: the icon should not put a smoking cue on the home screen. -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="26">
    <path d="M256 396V226"/>
  </g>

  <path d="M256 250c-6-62-52-104-116-108-4 66 44 114 116 116z" fill="#4ecdaf"/>
  <path d="M256 250c6-70 56-116 126-120 4 72-50 124-126 126z" fill="#b6ecdd"/>

  <!-- Timor-Leste flag yellow, as the ground the sprout grows from -->
  <path d="M150 400h212" stroke="#f5c518" stroke-width="26" stroke-linecap="round" fill="none"/>
</svg>
